<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Schobrain | Pregunta</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <link rel="icon" type="image/png" href="assets/img/logoSchobrain.png" />
    <link rel="stylesheet" href="assets/style.css" />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css"
    />
    <script
      type="text/javascript"
      src="https://cdn.jsdelivr.net/npm/toastify-js"
    ></script>
    <style>
      body {
        background-color: #f0f2f5;
      }
      .content-wrapper {
        background-color: #ffffff;
        width: 100%;
        max-width: 900px;
        margin: 2rem auto;
        border-radius: 15px;
        padding: 2rem 3rem;
        color: #333;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      }
      .main-question-container .article-card {
        background-color: transparent;
        box-shadow: none;
        border: none;
        padding: 0;
        margin-bottom: 2rem;
        border-bottom: 1px solid #e0e0e0;
        padding-bottom: 2rem;
      }
      .comments-section h2 {
        font-size: 1.5rem;
        margin-bottom: 1.5rem;
        color: #12121c;
      }
      .new-comment-form {
        display: flex;
        flex-direction: column; /* <-- Cambiado a columna */
        gap: 1rem;
        align-items: flex-start;
        margin-bottom: 2.5rem;
      }
      .textarea-wrapper {
        flex-grow: 1;
        position: relative;
        width: 100%; /* <-- Añadido */
      }
      .new-comment-form textarea {
        width: 100%;
        min-height: 50px;
        padding: 0.8rem 1rem;
        border-radius: 25px;
        border: 1px solid #ced4da;
        resize: vertical;
        font-family: "Outfit", sans-serif;
        font-size: 1rem;
        transition: border-color 0.2s, box-shadow 0.2s;
      }
      .new-comment-form textarea:focus {
        outline: none;
        border-color: #8ab4f8;
        box-shadow: 0 0 0 3px rgba(37, 117, 252, 0.25);
      }

      /* === INICIO DE LA MODIFICACIÓN === */
      /* Contenedor para los botones */
      .comment-form-actions {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 100%;
      }
      /* Ajustes para el grupo de input de archivo */
      .comment-form-actions .input-group {
        flex-grow: 1;
        margin-bottom: 0;
      }
      .comment-form-actions .file-input-group {
        max-width: 300px; /* Límite de ancho para el input */
        padding: 0.3rem 0.5rem; /* Menos padding */
      }
      .comment-form-actions .file-input-label {
        padding: 0.5rem 1rem; /* Botón de input más pequeño */
        font-size: 0.9rem;
      }
      .comment-form-actions .file-name-display {
        font-size: 0.9rem;
      }
      /* === FIN DE LA MODIFICACIÓN === */

      .new-comment-form button[type="submit"] {
        /* <-- Específico para el botón de submit */
        background-color: #6a11cb;
        color: white;
        border: none;
        border-radius: 25px;
        padding: 0.8rem 1.8rem;
        font-weight: 700;
        cursor: pointer;
        transition: background-color 0.2s;
        margin-top: 1px;
      }
      .new-comment-form button[type="submit"]:hover {
        background-color: #560bad;
      }
      .comment-card {
        border-bottom: 1px solid #e9ecef;
        padding: 1.5rem 0;
      }
      .comment-card:last-child {
        border-bottom: none;
        padding-bottom: 0;
      }
      .comment-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 0.5rem;
      }
      .comment-author-date {
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }
      .comment-author {
        font-weight: 700;
        font-size: 1.1rem;
        color: #2575fc;
      }
      .comment-date {
        font-size: 0.85rem;
        color: #6c757d;
      }
      .comment-content p {
        line-height: 1.6;
        color: #212529;
      }

      /* ✅ ESTILOS AÑADIDOS PARA EL MENÚ DE OPCIONES DEL COMENTARIO */
      .comment-options-menu {
        position: relative;
      }
      .comment-options-menu .options-toggle-btn {
        font-size: 0.9rem;
      } /* Botón de 3 puntos más pequeño */
    </style>
  </head>
  <body>
    <div class="main-container">
      <header
        class="main-header"
        style="background-color: #ffffff; color: #333"
      >
        <div
          class="header-left"
          style="display: flex; align-items: center; gap: 1rem"
        >
          <a href="/"
            ><img
              src="assets/img/logoSchobrain.png"
              alt="Logo Schobrain"
              class="header-logo"
          /></a>
          <h1 style="font-size: 1.5rem; margin: 0; color: #333">Schobrain</h1>
        </div>
        <div class="header-right">
          <span class="welcome-user" style="color: #333"
            >Bienvenido, <span id="logged-in-username">Usuario</span></span
          >
          <a
            href="/"
            class="modal-button secondary"
            style="
              text-decoration: none;
              padding: 0.6rem 1.2rem;
              background-color: #e9ecef;
              color: #495057;
            "
          >
            Volver al Feed
          </a>
        </div>
      </header>

      <div class="content-wrapper">
        <div id="main-question-container" class="main-question-container"></div>
        <div id="comments-section" class="comments-section">
          <h2>Respuestas</h2>

          <form id="comment-form" class="new-comment-form" novalidate>
            <div class="textarea-wrapper">
              <textarea
                id="comment-content"
                name="content"
                placeholder="Responde algo..."
                required
                minlength="5"
              ></textarea>
              <div class="textarea-toolbar">
                <button
                  type="button"
                  id="toggle-comment-symbols-btn"
                  class="toolbar-btn"
                  title="Símbolos"
                >
                  <i class="fas fa-square-root-alt"></i>
                </button>
              </div>
              <div id="comment-symbols-panel" class="symbols-panel"></div>
            </div>

            <div class="comment-form-actions">
              <div class="input-group file-input-group">
                <label for="comment-image-files" class="file-input-label"
                  ><i class="fas fa-paperclip"></i> Adjuntar</label
                >
                <span id="comment-file-name-display" class="file-name-display"
                  >Sin archivos</span
                >
                <input
                  type="file"
                  id="comment-image-files"
                  name="imageFiles"
                  accept="image/jpeg, image/png, image/gif"
                  class="hidden-file-input"
                  multiple
                />
              </div>
              <button type="submit">Responder</button>
            </div>
            <p
              class="file-size-info"
              style="width: 100%; text-align: left; margin-left: 5px"
            >
              Máx 5 imágenes (5MB c/u)
            </p>
          </form>
          <div id="comments-list"></div>
        </div>
      </div>
    </div>

    <div id="image-preview-modal" class="modal-overlay">
      <span class="close-preview-btn">&times;</span>
      <img
        class="preview-image"
        id="preview-image-src"
        src=""
        alt="Previsualización de imagen"
      />
    </div>

    <div id="delete-confirm-modal" class="modal-overlay">
      <div class="modal-content">
        <h2>¿Confirmas la eliminación?</h2>
        <p class="warning-text-deleteQuestion">
          Esta acción es permanente y no se puede deshacer. ¿Estás seguro?
        </p>
        <div class="modal-actions">
          <button id="cancel-delete" class="modal-button secondary">
            Cancelar
          </button>
          <button id="confirm-delete" class="modal-button danger">
            Sí, eliminar
          </button>
        </div>
      </div>
    </div>

    <div id="edit-question-modal" class="modal-overlay">
      <div class="modal-content question-modal-content custom-modal">
        <div class="modal-header">
          <h2>Editar Pregunta</h2>
          <button
            type="button"
            class="close-modal-button"
            id="close-edit-modal"
          >
            <i class="fas fa-times"></i>
          </button>
        </div>
        <form id="editQuestionForm" novalidate enctype="multipart/form-data">
          <input type="hidden" id="edit-article-id" name="articleId" />
          <div class="input-group">
            <label for="edit-question-content">Describe tu pregunta</label>
            <textarea
              id="edit-question-content"
              name="content"
              rows="5"
              minlength="10"
              required
            ></textarea>
            <div class="textarea-toolbar">
              <button
                type="button"
                id="edit-toggle-symbols-btn"
                class="toolbar-btn"
                title="Símbolos"
              >
                <i class="fas fa-square-root-alt"></i>
              </button>
            </div>
            <div id="edit-math-symbols-panel" class="symbols-panel"></div>
          </div>

          <div class="input-group">
            <label for="edit-tag-select">Tema</label>
            <select
              id="edit-tag-select"
              name="tags"
              class="custom-select"
              required
            ></select>
          </div>

          <div class="input-group">
            <label>Imágenes Actuales</label>
            <div id="current-images-preview" class="images-preview-grid"></div>
          </div>

          <div class="input-group file-input-group">
            <label for="edit-image-files" class="file-input-label"
              >Añadir nuevas imágenes</label
            >
            <span id="edit-file-name-display" class="file-name-display"
              >Ningún archivo seleccionado</span
            >
            <input
              type="file"
              id="edit-image-files"
              name="imageFiles"
              accept="image/jpeg, image/png, image/gif"
              class="hidden-file-input"
              multiple
            />
          </div>
          <p class="file-size-info">Hasta 5 imágenes, tamaño máximo 5MB c/u</p>

          <div class="modal-actions">
            <button
              type="button"
              id="cancel-edit-question"
              class="modal-button secondary custom-cancel-button"
            >
              Cancelar
            </button>
            <button type="submit" class="modal-button custom-submit-button">
              Guardar Cambios
            </button>
          </div>
        </form>
      </div>
    </div>
    <script type="module" src="/js/pregunta.js"></script>
  </body>
</html>
