<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Perfil Personal</title>
  <link rel="stylesheet" href="assets/perfil.css">
</head>
<body>
  <div class="perfil-container">
    <div class="perfil-header">
      <div class="avatar-wrapper">
        <img id="avatarUrl" class="perfil-avatar" src="" alt="Avatar">
        <label for="avatarInput" class="avatar-edit-btn">Cambiar foto</label>
        <input type="file" id="avatarInput" accept="image/*" style="display:none">
      </div>
      <div>
        <h2>
          <input id="firstName" class="input-name" placeholder="Nombre">
          <input id="lastName" class="input-name" placeholder="Apellido">
        </h2>
        <span id="role" class="role-badge"></span>
      </div>
    </div>
    <div class="perfil-info">
      <label>Biografía:</label>
      <textarea id="biography" placeholder="Escribe algo sobre ti..."></textarea>
      <label>Fecha de nacimiento:</label>
      <input type="date" id="birthDate">
      <label>Email:</label>
      <input type="email" id="email">
      <label>Usuario:</label>
      <input type="text" id="username">
    </div>
    <button id="saveProfileBtn">Guardar cambios</button>
    <div id="profileMsg"></div>
  </div>
  <script src="js/perfil/perfil.js"></script>
</body>
</html>
